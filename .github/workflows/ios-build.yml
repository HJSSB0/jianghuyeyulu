name: 测试与 iOS 构建

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  # 逻辑回归：107 项断言（headless，无需渲染）
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Godot 4.7.2
        run: |
          curl -L --fail -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: 逻辑回归测试
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script .zcode/tests/run_tests.gd

  # iOS 导出：macOS runner 产出未签名 Xcode 工程 + 未签名 ipa（Windows 免 Mac：Sideloadly 侧载，见 docs/03 路线 C）
  export-ios:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Godot 4.7.2 与导出模板
        run: |
          curl -L --fail -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip
          unzip godot.zip
          chmod +x Godot.app/Contents/MacOS/Godot
          curl -L --fail -o templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates"
          unzip templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
      - name: 导入资源（生成 .godot/imported）
        run: ./Godot.app/Contents/MacOS/Godot --headless --path . --import
      - name: 环境探针（ETC2 设置可读性）
        run: |
          mkdir -p build
          ./Godot.app/Contents/MacOS/Godot --headless --path . --script res://.github/scripts/etc2probe.gd 2>&1 | tee build/probe.log
      - name: 导出 iOS（未签名 Xcode 工程）
        run: |
          mkdir -p build
          set -o pipefail
          ./Godot.app/Contents/MacOS/Godot --headless --path . --export-release "iOS" build/JiangHuYeYuLu.xcodeproj 2>&1 | tee build/export.log
          ls -la build/
      - name: 上传导出日志（诊断）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-log
          path: build/export.log
          if-no-files-found: ignore
      - name: 输出导出日志到 Summary（匿名可见）
        if: always()
        run: |
          {
            echo "## Godot 导出输出"
            echo '<pre>'
            cat build/export.log
            echo '</pre>'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 失败时回传诊断包
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "=== probe.log ==="
            cat build/probe.log 2>/dev/null || echo "(无)"
            echo "=== export.log ==="
            cat build/export.log 2>/dev/null || echo "(无)"
            echo "=== export_presets.cfg ==="
            cat export_presets.cfg
            echo "=== project.godot [rendering] 段 ==="
            sed -n '/^\[rendering\]/,/^\[/p' project.godot | sed '$d'
            echo "=== build 目录 ==="
            ls -la build
          } > build/diag.txt
          git config user.email "ci@jianghuyeyulu.invalid"
          git config user.name "ci-bot"
          git checkout -B ci-logs
          git add -f build/diag.txt || true
          git add -f build/export.log || true
          git add -f build/probe.log || true
          git commit -m "ci: diag ${GITHUB_SHA::7}" --allow-empty
          git push -f origin ci-logs || true
          gh release delete "diag-${GITHUB_RUN_NUMBER}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "diag-${GITHUB_RUN_NUMBER}" build/diag.txt build/export.log build/probe.log \
            --title "diag run ${GITHUB_RUN_NUMBER}" --notes "自动诊断包（匿名可下载）" || true
      - name: 打包未签名 ipa
        run: |
          cd build
          TARGET=$(xcodebuild -list -project JiangHuYeYuLu.xcodeproj | awk '/Targets:/{f=1;next}/Build Configurations:/{f=0}f{gsub(/^[ \t]+|[ \t]+$/,"");if($0!=""){print;exit}}')
          echo "xcodebuild target: $TARGET"
          test -n "$TARGET"
          xcodebuild -project JiangHuYeYuLu.xcodeproj -target "$TARGET" -configuration Release \
            -sdk iphoneos SYMROOT=stage CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          APP=$(find stage/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          echo "app bundle: $APP"
          test -n "$APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry JiangHuYeYuLu-unsigned.ipa Payload
          ls -la JiangHuYeYuLu-unsigned.ipa
      - name: 上传 Xcode 工程
        uses: actions/upload-artifact@v4
        with:
          name: JiangHuYeYuLu-iOS-Xcode
          path: build/JiangHuYeYuLu.xcodeproj
          if-no-files-found: error
      - name: 上传未签名 ipa
        uses: actions/upload-artifact@v4
        with:
          name: JiangHuYeYuLu-iOS-unsigned-ipa
          path: build/JiangHuYeYuLu-unsigned.ipa
          if-no-files-found: error
      - name: 发布未签名 ipa 到 Release（匿名可下载）
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete unsigned-ipa --yes --cleanup-tag 2>/dev/null || true
          gh release create unsigned-ipa build/JiangHuYeYuLu-unsigned.ipa \
            --title "iOS 未签名 ipa（自动构建）" \
            --notes "commit ${GITHUB_SHA::7}；供 Sideloadly 侧载用（docs/03 路线 C），每次构建覆盖发布" \
            --latest
